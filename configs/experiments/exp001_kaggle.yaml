# EXP001, tuned for Kaggle's 2x T4 (16GB each) accelerator.
#
# Same OOM-safe settings as exp001.yaml (proto_max_length=150,
# per_gpu_batch_size=1, max_val_batches -- see exp001.yaml's own notes for
# why), launched under torchrun --nproc_per_node=2 so training/distributed.py
# wraps the model in DistributedDataParallel across both GPUs (PLAN.md
# section 26: throughput scales ~2x, VRAM per GPU does NOT pool -- each GPU
# still needs the same per-GPU budget exp001.yaml already fits in).
#
# gradient_accumulation halved 16->8 vs exp001.yaml so the EFFECTIVE batch
# size stays the same: effective_batch = per_gpu_batch * grad_accum * num_gpus
#   exp001.yaml (1 GPU):   1 * 16 * 1 = 16
#   exp001_kaggle.yaml (2 GPUs): 1 * 8 * 2 = 16
# Keeping effective batch size constant means the learning-rate schedule
# tuned for EXP001 stays valid unchanged.
extends: ../tuna_v1.yaml
experiment_id: EXP001
learning_rate:
  lora: { warmup_start: 5e-5, peak: 1e-4, decay_end: 1e-5 }
  khmer_embedding: { warmup_start: 1e-4, peak: 2e-4, decay_end: 2e-5 }

dataset:
  name: Panhapich/khmer-tts-processed
  format: protos
  proto_train_dir: data/protos/train
  proto_val_dir: data/protos/validation
  text_is_pre_normalized: true
  proto_max_length: 150

training:
  max_steps: 40000
  validation_interval: 1000
  checkpoint_interval: 100
  gradient_clip_norm: 1.0
  seed: 42
  per_gpu_batch_size: 1
  gradient_accumulation: 8
  mixed_precision: bf16
  max_val_batches: 50
  log_interval: 20

# Kaggle sessions are wiped when they end (see kaggle/README.md) -- upload
# every checkpoint straight to the Hub instead of relying only on
# /kaggle/working surviving via Save Version. checkpoint.hf_repo is
# inherited from tuna_v1.yaml (Panhapich/Tuna-TTS); upload_to_hub is the
# opt-in switch training/trainer.py checks (off by default, including in
# exp001.yaml, so local runs never upload unless asked). Needs an HF_TOKEN
# env var with write access to that repo -- see kaggle/README.md for how
# the notebook supplies it from a Kaggle Secret, never hardcoded here.
checkpoint:
  directory: checkpoints/
  latest: latest.pt
  best: best.pt
  metadata: metadata.json
  hf_repo: Panhapich/Tuna-TTS
  upload_to_hub: true
