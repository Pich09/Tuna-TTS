# EXP001 - Baseline (PLAN.md section 17/40)
extends: ../tuna_v1.yaml
experiment_id: EXP001
learning_rate:
  lora: { warmup_start: 5e-5, peak: 1e-4, decay_end: 1e-5 }
  khmer_embedding: { warmup_start: 1e-4, peak: 2e-4, decay_end: 2e-5 }

# NOTE on config merging (scripts/train.py's load_config): a top-level key
# present in this file REPLACES the base tuna_v1.yaml key entirely (only
# "learning_rate" gets a one-level merge) -- so "training" and "dataset"
# below repeat tuna_v1.yaml's fields in full, not as partial overrides.
#
# Tuned for this environment's 16GB GPUs, verified against the pilot run
# (configs/experiments/exp001_pilot.yaml, PASSED 2026-09-11 -- see
# progress.log): tuna_v1.yaml's untouched defaults (per_gpu_batch_size=2,
# no proto_max_length, no max_val_batches) hit a ~4.3GB single-tensor OOM
# in the cross-entropy logits (full extended vocab_size=163776 times
# packed sequence length) and, separately, an infinite hang in validation
# (fish_speech's protos dataset streams forever -- run_validation now
# requires a batch cap). per_gpu_batch_size dropped 2->1 with
# gradient_accumulation doubled 8->16 to keep the same effective batch
# size of 16.
dataset:
  name: Panhapich/khmer-tts-processed
  format: protos
  proto_train_dir: data/protos/train
  proto_val_dir: data/protos/validation
  text_is_pre_normalized: true
  proto_max_length: 150

training:
  max_steps: 40000
  validation_interval: 1000
  checkpoint_interval: 100
  gradient_clip_norm: 1.0
  seed: 42
  per_gpu_batch_size: 1
  gradient_accumulation: 16
  mixed_precision: bf16
  max_val_batches: 50
  log_interval: 20
